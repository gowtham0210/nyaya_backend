server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets never change, so cache them hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routing (react-router): unknown paths fall back to the SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
